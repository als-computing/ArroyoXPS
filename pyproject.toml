[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arroyoxps"
version = "0.1.0"
authors = [
    { name="Dylan McReynolds", email="dmcreynolds@lbl.gov"},
]
description = "a package to perform computations and suggestion during a time-resolved AP-XPS experiment"
readme = "README.md"
requires-python = ">=3.11,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "arroyopy @ git+https://github.com/als-computing/arroyopy.git@refs/heads/open_telemetry",
    "arroyosas @ git+https://github.com/als-computing/arroyosas.git",
    "astropy",
    "dynaconf",
    "python-dotenv",
    "pandas",
    "msgpack",
    "numpy",
    "Pillow",
    "pyzmq",
    "scipy==1.14.1",
    "tiled[client]",
    "tqdm",
    "typer",
    "websockets",
    "zarr"
]

[project.optional-dependencies]
# These are required for developing the package (running the tests, building
# the documentation) but not necessarily required for _using_ it.
dev = [
    "flake8",
    "fakeredis",
    "pre-commit",
    "pytest-asyncio",
    "pytest-mock",
    "tiled[server]",
]

notebook = [
    "jupyterlab",
    "matplotlib",
    "python-dotenv"
]

simulator = [
    "h5py"
]

[project.urls]
Homepage = "https://github.com/als-computing/AP-XPS"
Issues = "https://github.com/als-computing/AP-XPS/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.isort]

profile = "black"
[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
