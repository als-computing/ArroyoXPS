services:
  tiled:
    # see the file ./tiled/deploy/config.yml for detailed configuration of tiled
    image: ghcr.io/bluesky/tiled:main
    ports:
      - "8000:8000"
    environment:
      - TILED_SINGLE_USER_API_KEY=${TILED_SINGLE_USER_API_KEY}
    volumes:
      - ./services/tiled/deploy:/deploy:Z
      - ./data:/data:Z
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://tiled:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mle_net


  timepix_processor:
    build:
      context: .
      dockerfile: Dockerfile_processor
    command: "block_configs/timepix_processor_block.yaml"
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - .:/app:Z
    networks:
      mle_net:


  frontend:
    build:
      context: .
      dockerfile: Dockerfile_frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    volumes:
      - .:/app:Z
    networks:
      mle_net:

networks:
  mle_net:
    name: mle_net
    driver: bridge
